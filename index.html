<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="다윗의 삶을 따라가는 3D 성경 게임: 목동에서 왕까지, 열 개의 장">
</head>
<body>
<title>The Shepherd King</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10121a; --panel:rgba(14,16,24,.80); --panel2:rgba(14,16,24,.55);
  --lapis:#3a5fa6; --gold:#e4b95a; --gold2:#f4d994; --bone:#f1ead9; --dust:#bdb29b; --ember:#e36a3d; --olive:#8fa05a;
  --disp:"Frank Ruhl Libre","Gowun Batang",Georgia,serif;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html[lang="ko"]{ --disp:"Gowun Batang","Frank Ruhl Libre",Georgia,serif; }
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--ui);
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
#c.aiming{cursor:crosshair}
button{font-family:var(--ui);color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.btn{appearance:none;border:1px solid rgba(228,185,90,.55);background:rgba(228,185,90,.12);color:var(--bone);
  padding:.8rem 1.4rem;border-radius:4px;font-size:1rem;font-weight:500;letter-spacing:.02em;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{background:rgba(228,185,90,.26);border-color:var(--gold)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);color:#1b1608;border-color:var(--gold);font-weight:600}
.btn.primary:hover{background:var(--gold2)}
.btn.ghost{background:transparent;border-color:rgba(241,234,217,.25)}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;align-items:center;padding:0 max(16px,6vw);
  background:linear-gradient(90deg,rgba(12,13,20,.88) 0%,rgba(12,13,20,.55) 38%,rgba(12,13,20,0) 70%);z-index:30}
#title .inner{max-width:34rem;display:flex;flex-direction:column;gap:1.2rem}
#title .heb{font-family:"Frank Ruhl Libre",serif;font-size:clamp(1.6rem,4vw,2.4rem);color:var(--gold);direction:rtl;text-align:left;line-height:1}
#title h1{font-family:var(--disp);font-weight:900;font-size:clamp(3.4rem,11vw,7.5rem);line-height:.9;margin:0;letter-spacing:-.01em;color:var(--bone);text-wrap:balance}
html[lang="ko"] #title h1{font-weight:700;letter-spacing:-.03em}
#title .sub{font-family:var(--disp);font-size:clamp(1.05rem,2.6vw,1.4rem);color:var(--dust);letter-spacing:.08em}
#title .row{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.6rem}
#title .foot{font-size:.8rem;color:var(--dust);opacity:.85;max-width:28rem;line-height:1.5}
.lang{display:inline-flex;border:1px solid rgba(241,234,217,.25);border-radius:4px;overflow:hidden;align-self:flex-start}
.lang button{background:transparent;border:0;padding:.45rem .8rem;font-size:.85rem;color:var(--dust)}
.lang button[aria-pressed="true"]{background:rgba(228,185,90,.2);color:var(--bone)}
#chapterList{display:grid;gap:.5rem;margin-top:.2rem}
#chapterList button{display:grid;grid-template-columns:2.4rem 1fr;align-items:center;gap:.6rem;text-align:left;
  background:rgba(14,16,24,.6);border:1px solid rgba(241,234,217,.14);border-radius:4px;padding:.6rem .8rem}
#chapterList button:hover{border-color:var(--gold)}
#chapterList .hl{font-family:"Frank Ruhl Libre",serif;font-size:1.7rem;color:var(--gold);text-align:center;line-height:1}
#chapterList .tt{font-family:var(--disp);font-size:1.05rem}
#chapterList .rf{font-size:.75rem;color:var(--dust)}

/* ---------- chapter card ---------- */
#card{position:fixed;inset:0;z-index:40;display:flex;align-items:center;padding:0 max(16px,7vw);
  background:linear-gradient(90deg,rgba(10,11,17,.94),rgba(10,11,17,.78) 55%,rgba(10,11,17,.5));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#card .inner{max-width:40rem;display:flex;flex-direction:column;gap:1rem;position:relative}
#card .numeral{position:absolute;right:-1rem;top:-5rem;font-family:"Frank Ruhl Libre",serif;font-size:clamp(9rem,26vw,16rem);color:rgba(228,185,90,.10);line-height:1;pointer-events:none}
#card h2{font-family:var(--disp);font-size:clamp(2.2rem,6.5vw,4rem);line-height:1.02;margin:0;font-weight:700;text-wrap:balance}
#card .ref{color:var(--dust);font-size:.95rem}
#card blockquote{margin:.6rem 0 .4rem;padding:0 0 0 1rem;border-left:2px solid var(--gold);font-family:var(--disp);font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.55;color:var(--bone);font-style:italic;max-width:36rem}
html[lang="ko"] #card blockquote{font-style:normal}
#card cite{display:block;font-style:normal;font-family:var(--ui);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:.5rem}
#card .row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.6rem}
#card .note{font-size:.9rem;color:var(--dust);line-height:1.55;max-width:34rem}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#plate{position:absolute;left:max(16px,2vw);top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:.35rem;max-width:min(26rem,70vw)}
#plate .ctitle{font-family:var(--disp);font-size:1.25rem;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#objective{display:flex;gap:.6rem;align-items:baseline;background:var(--panel2);border-left:2px solid var(--gold);padding:.45rem .7rem;border-radius:0 4px 4px 0;font-size:.92rem;line-height:1.35;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#objective:empty,#objective.empty{display:none}
#objCount{color:var(--gold2);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
#tr{position:absolute;right:max(16px,2vw);top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;gap:.5rem;align-items:center;pointer-events:auto}
.ibtn{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid rgba(241,234,217,.25);background:var(--panel2);display:grid;place-items:center;padding:0}
.ibtn svg{width:1.15rem;height:1.15rem;stroke:var(--bone);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stones{display:flex;gap:4px;align-items:center;background:var(--panel2);padding:.45rem .6rem;border-radius:999px;font-size:.8rem;color:var(--dust)}
#stones i{width:.62rem;height:.5rem;border-radius:50%;background:#cfc6b4;display:block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.25)}
#stones i.off{background:rgba(207,198,180,.18);box-shadow:none}
#compass{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);width:2.6rem;height:2.6rem;display:grid;place-items:center}
#compass svg{width:100%;height:100%;transition:opacity .3s}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border:2px solid rgba(255,255,255,.85);border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.35);display:none}
#cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#fff;border-radius:50%}
#cross.on{display:block}
#cross.target{border-color:var(--gold2)}
#cross.weak{border-color:#ff5a36;transform:scale(1.25)}
#charge{position:absolute;left:50%;top:calc(50% + 26px);width:60px;height:4px;margin-left:-30px;background:rgba(255,255,255,.2);border-radius:2px;display:none;overflow:hidden}
#charge i{display:block;height:100%;width:0;background:var(--gold2)}
#prompt{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22%);transform:translateX(-50%);display:flex;gap:.55rem;align-items:center;background:var(--panel);padding:.5rem .9rem .5rem .5rem;border-radius:999px;border:1px solid rgba(228,185,90,.4);font-size:.95rem;white-space:nowrap}
#prompt kbd{font-family:var(--ui);background:var(--gold);color:#1b1608;border-radius:50%;width:1.7rem;height:1.7rem;display:grid;place-items:center;font-weight:700;font-size:.85rem}
#toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-family:var(--disp);font-size:clamp(1.3rem,3.6vw,2rem);text-align:center;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:0;transition:opacity .35s;max-width:90vw}
#toast.on{opacity:1}
#toast small{display:block;font-family:var(--ui);font-size:.9rem;color:var(--dust);margin-top:.3rem}
#detect{position:absolute;left:50%;top:36%;transform:translateX(-50%);width:160px;height:6px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .2s}
#detect i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3c14b,#e3452d)}
#vign{position:absolute;inset:0;box-shadow:inset 0 0 120px rgba(200,40,20,.0);transition:box-shadow .2s}

/* ---------- dialog ---------- */
#dialog{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(720px,calc(100% - 32px));
  background:var(--panel);border:1px solid rgba(228,185,90,.35);border-radius:6px;padding:1rem 1.2rem 1.1rem;z-index:20;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;box-sizing:border-box}
#dialog .spk{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:.35rem}
#dialog .spk.nar{color:var(--dust)}
#dialog .txt{font-family:var(--disp);font-size:clamp(1.02rem,2.3vw,1.22rem);line-height:1.55;min-height:3.1em}
#dialog .txt.nar{font-style:italic;color:#e4dccb}
html[lang="ko"] #dialog .txt.nar{font-style:normal}
#dialog .more{position:absolute;right:1rem;bottom:.6rem;color:var(--gold);font-size:.8rem;animation:bob 1s ease-in-out infinite}
#dialog .choices{display:flex;flex-direction:column;gap:.5rem;margin-top:.7rem}
#dialog .choices:empty{display:none}
#dialog .choices button{text-align:left;background:rgba(228,185,90,.1);border:1px solid rgba(228,185,90,.45);border-radius:4px;padding:.65rem .9rem;font-size:.98rem}
#dialog .choices button:hover{background:rgba(228,185,90,.25)}
@keyframes bob{50%{transform:translateY(3px)}}

/* ---------- touch ---------- */
#touch{position:fixed;inset:0;z-index:12;pointer-events:none;transition:opacity .25s}
body.talking #touch{opacity:0;visibility:hidden}
#joy{position:absolute;left:calc(max(16px,4vw));bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:124px;height:124px;border-radius:50%;background:rgba(14,16,24,.35);border:1px solid rgba(241,234,217,.25);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(241,234,217,.55)}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid rgba(228,185,90,.6);background:rgba(14,16,24,.5);color:var(--bone);font-size:.78rem;font-weight:600;display:grid;place-items:center;text-align:center;line-height:1.1}
.tbtn svg{width:26px;height:26px;stroke:var(--bone);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}
#tAct{right:calc(max(16px,4vw));bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:78px;height:78px}
#tSling{right:calc(max(16px,4vw) + 92px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:78px;height:78px}
#tRun{right:calc(max(16px,4vw) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:58px;height:58px}
.tbtn.on{background:rgba(228,185,90,.45)}

/* ---------- misc overlays ---------- */
#fade{position:fixed;inset:0;background:#07080c;opacity:0;pointer-events:none;z-index:50;transition:opacity .6s}
#fade.white{background:#fff6dc}
#help{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:25;background:var(--panel);border:1px solid rgba(228,185,90,.35);border-radius:6px;padding:1.2rem 1.4rem;width:min(420px,calc(100% - 32px));box-sizing:border-box}
#help h3{margin:0 0 .8rem;font-family:var(--disp);font-size:1.3rem}
#help dl{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;margin:0 0 1rem;font-size:.92rem;align-items:center}
#help dt{font-weight:600;color:var(--gold2);white-space:nowrap}
#help dd{margin:0;color:var(--bone)}
#menu{position:fixed;inset:0;z-index:45;background:rgba(10,11,17,.86);display:flex;align-items:center;justify-content:center;padding:0 16px}
#menu .inner{width:min(440px,100%);display:flex;flex-direction:column;gap:.8rem}
#menu h3{font-family:var(--disp);font-size:1.8rem;margin:0 0 .2rem}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);z-index:60;font-family:var(--disp);font-size:1.2rem;color:var(--dust);transition:opacity .6s}

#card{overflow-y:auto;padding-block:24px}
#card .inner{margin-block:auto}
#cQs{display:flex;flex-direction:column;gap:.5rem;max-width:36rem;border-top:1px solid rgba(228,185,90,.25);padding-top:.9rem}
#cQs:empty{display:none}
#cQs h4{margin:0;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
#cQs ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.45rem;font-size:.98rem;line-height:1.55}
#chapterList{max-height:46vh;overflow-y:auto;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));padding-right:4px}
#rhythm{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);width:min(380px,calc(100% - 32px));height:min(46vh,400px);z-index:22;display:flex;flex-direction:column;gap:8px}
#rhythm .meter{background:var(--panel);border:1px solid rgba(228,185,90,.35);border-radius:6px;padding:.5rem .7rem;font-size:.8rem;color:var(--dust);display:flex;flex-direction:column;gap:.35rem}
#rhythm .meter .bar{height:8px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
#rhythm .meter .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#6f86c9,#e4b95a);transition:width .2s}
#rhythm .lanes{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative}
#rhythm .lane{position:relative;background:linear-gradient(180deg,rgba(14,16,24,.25),rgba(14,16,24,.7));border:1px solid rgba(228,185,90,.25);border-radius:6px;overflow:hidden;touch-action:none;cursor:pointer}
#rhythm .lane::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(241,234,217,.25)}
#rhythm .lane.hit{background:linear-gradient(180deg,rgba(14,16,24,.25),rgba(228,185,90,.45))}
#rhythm .lane b{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:.8rem;color:var(--dust);z-index:2}
#rhythm .hitline{position:absolute;left:0;right:0;bottom:14%;height:3px;background:var(--gold2);box-shadow:0 0 12px var(--gold);pointer-events:none;z-index:3}
#rhythm .note{position:absolute;left:50%;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d8,#e4b95a 60%,#9a7424);box-shadow:0 0 10px rgba(228,185,90,.7);z-index:2}
#rhythm .note.miss{opacity:.25;filter:grayscale(1)}
#dodge{position:fixed;left:50%;top:58%;transform:translate(-50%,-50%);z-index:24;display:flex;flex-direction:column;align-items:center;gap:.6rem}
#dodge p{margin:0;font-family:var(--disp);font-size:clamp(1.2rem,3.4vw,1.7rem);text-shadow:0 2px 12px rgba(0,0,0,.8);text-align:center}
#dodge button{font-size:1.2rem;font-weight:700;padding:1rem 2.2rem;border-radius:999px;border:2px solid #ff7a55;background:rgba(200,50,30,.85);color:#fff;animation:pulse .5s ease-in-out infinite alternate}
#dodge .t{width:220px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
#dodge .t i{display:block;height:100%;background:#ff7a55;width:100%}
@keyframes pulse{to{transform:scale(1.06)}}

@media (max-width:640px){
  #title{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px);background:linear-gradient(0deg,rgba(12,13,20,.92) 0%,rgba(12,13,20,.6) 55%,rgba(12,13,20,0) 85%)}
  #plate .ctitle{font-size:1.05rem}
  #objective{font-size:.84rem}
  #card{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
  #card .numeral{top:-4rem;right:0}
}
@media (prefers-reduced-motion:reduce){ #dialog .more{animation:none} #fade{transition:none} }
</style>

<canvas id="c" tabindex="0" aria-label="Game view"></canvas>
<div id="loading">…</div>

<div id="hud" hidden>
  <div id="vign"></div>
  <div id="plate"><div class="eyebrow" id="hudRef"></div><div class="ctitle" id="hudTitle"></div><div id="objective" class="empty"><span id="objText"></span><span id="objCount"></span></div></div>
  <div id="compass"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="rgba(14,16,24,.55)" stroke="rgba(228,185,90,.5)"/><path id="compArrow" d="M20 7 L27 25 L20 21 L13 25 Z" fill="#e4b95a"/></svg></div>
  <div id="tr">
    <div id="stones" hidden></div>
    <button class="ibtn" id="btnSound" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="ibtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="cross"></div><div id="charge"><i></i></div>
  <div id="prompt" hidden><kbd id="promptKey">E</kbd><span id="promptText"></span></div>
  <div id="toast"></div>
  <div id="detect"><i></i></div>
</div>

<div id="dialog" hidden role="dialog" aria-live="polite"><div class="spk"></div><div class="txt"></div><div class="choices"></div><div class="more">▼</div></div>

<div id="touch" hidden>
  <div id="joy"><div id="knob"></div></div>
  <button class="tbtn" id="tAct"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14c0 4-2.5 7-6 7-2.5 0-4-1.2-5.5-3.5L3.8 14.8a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg><span id="tActL">Talk</span></button>
  <button class="tbtn" id="tSling" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><path d="M12 10c-3 3-6 5-8 10M12 10c3 3 6 5 8 10"/></svg><span id="tSlingL">Sling</span></button>
  <button class="tbtn" id="tRun"><span id="tRunL">Run</span></button>
</div>

<div id="title" hidden>
  <div class="inner">
    <div class="heb" lang="he">דָּוִד</div>
    <h1 id="tTitle">David</h1>
    <div class="sub" id="tSub"></div>
    <div class="lang" role="group" aria-label="Language"><button id="lKo" aria-pressed="false">한국어</button><button id="lEn" aria-pressed="false">English</button></div>
    <div class="row"><button class="btn primary" id="bStart"></button><button class="btn ghost" id="bChapters"></button></div>
    <div id="chapterList" hidden></div>
    <div class="foot" id="tFoot"></div>
  </div>
</div>

<div id="card" hidden>
  <div class="inner">
    <div class="numeral" id="cNum" lang="he"></div>
    <div class="eyebrow" id="cEye"></div>
    <h2 id="cTitle"></h2>
    <div class="ref" id="cRef"></div>
    <blockquote id="cQuote"><span id="cVerse"></span><cite id="cCite"></cite></blockquote>
    <div class="note" id="cNote"></div>
    <div id="cQs"></div>
    <div class="row" id="cRow"></div>
  </div>
</div>

<div id="help" hidden><h3 id="hTitle"></h3><dl id="hList"></dl><button class="btn primary" id="hOk"></button></div>

<div id="menu" hidden><div class="inner"><h3 id="mTitle"></h3>
  <button class="btn primary" id="mResume"></button>
  <button class="btn" id="mRestart"></button>
  <button class="btn" id="mHelp"></button>
  <button class="btn" id="mLang"></button>
  <button class="btn ghost" id="mTitleBtn"></button>
</div></div>

<div id="fade"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   The Shepherd King  -  engine

(function boot() {
  const ld = document.getElementById('loading');
  let ok = false; try { const c = document.createElement('canvas'); ok = !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { }
  if (!ok || typeof THREE === 'undefined') { ld.textContent = tr({ en: 'This game needs a browser with WebGL turned on.', ko: '이 게임은 WebGL을 지원하는 브라우저가 필요해요.' }); return; }
  try {
    const game = new Game(); window.GAME = game;
    game.showTitle().then(() => { ld.style.opacity = 0; setTimeout(() => ld.remove(), 700); });

})();
