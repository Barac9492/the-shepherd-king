name: Audience copy regression
on:
  push:
    branches: [aside/audience-neutral-20260927]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked JavaScript test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run core and full story regressions
        # Keep the established story renderer suites serial on this runner.
        # Challenge, exploration and garden get their own runners below, preserving all
        # checks without stretching the existing 15-minute workflow job budget.
        run: node --test --test-concurrency=1 $(find tests -maxdepth 1 -name '*.test.mjs' ! -name 'sling-challenge-runtime.test.mjs' ! -name 'david-exploration-runtime.test.mjs' ! -name 'peace-garden-runtime.test.mjs' | sort)
  garden-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run all nineteen peace garden browser scenarios
        run: node --test tests/peace-garden-runtime.test.mjs
  challenge-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run all fourteen challenge browser scenarios
        run: node --test tests/sling-challenge-runtime.test.mjs
  exploration-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run all fifteen exploration browser scenarios
        run: node --test tests/david-exploration-runtime.test.mjs
  ranking-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify ranking access and consent with local fixtures
        run: |
          PORT=43983 npm run dev > /tmp/ranking-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:43983/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:43983/ > /dev/null
          npm run test:ranking
          npm run test:ranking:submit
  dance-engedi-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
      BASE_URL: http://127.0.0.1:43989
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run all dance and En-Gedi browser regressions
        run: |
          PORT=43989 npm run dev > /tmp/side-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL/" > /dev/null
          npm run test:menu
          npm run test:dance
          npm run test:engedi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dance-engedi-browser-evidence
          path: test-results/
  side-ranking-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify both rankings through loopback HTTP, server replay and ephemeral PostgreSQL
        run: npm run test:side-ranking
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: side-ranking-browser-evidence
          path: test-results/side-rankings/
  keilah-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHROME_PATH: /usr/bin/google-chrome
      SOFTWARE: '1'
      BASE_URL: http://127.0.0.1:43991
      KEILAH_LOCAL_DB: test-results/keilah-ci-db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preinstalled Chrome
        run: test -x "$CHROME_PATH" && "$CHROME_PATH" --version
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify real-time co-op and recovery with local PostgreSQL
        run: |
          PORT=43991 npm run dev:keilah > /tmp/keilah-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/keilah/config" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$BASE_URL/api/keilah/config" > /dev/null
          npm run test:keilah:browser
          node scripts/check-keilah-recovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keilah-browser-evidence
          path: test-results/keilah/
